name: cloud_notes_fresh
description: "A Flutter NoteApp with offline storage and reminders."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  intl: ^0.19.0
  sqflite: ^2.4.5
  path: ^1.9.1
  file_picker: ^8.1.7
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/my_logo.png   # 👈 Fixed indentation here (4 spaces)

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/my_logo.png"
  min_sdk_android: 21